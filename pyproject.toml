[project]
name = "orbit-jobs"
version = "0.2.3"
description = "SQLite job queue with capability workers and HTTP remote workers"
requires-python = ">=3.12"  # the voice sidecar (.venv-voice, 3.12) imports core.runctx
# The queue, local worker and telemetry need only the standard library.
dependencies = []

[project.optional-dependencies]
# orbit_jobs.remote_worker (the HTTP client a remote machine runs).
remote = ["httpx>=0.28"]
# orbit_jobs.routes (the FastAPI router a server mounts for remote workers).
server = ["fastapi>=0.135.3"]
# orbit_jobs.mesh (the optional NATS transport: wake-ups, bus bridging, request/reply).
mesh = ["nats-py>=2.11"]

[dependency-groups]
dev = ["orbit-jobs[remote,server,mesh]", "pytest>=9.0.3", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit_jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = ["integration: needs a real subprocess or nats-server"]
